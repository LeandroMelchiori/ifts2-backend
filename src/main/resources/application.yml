spring:
  application:
    name: ifts2-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE:10MB}
      max-request-size: ${STORAGE_MAX_REQUEST_SIZE:11MB}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

app:
  storage:
    provider: ${STORAGE_PROVIDER:none}
    test-endpoints-enabled: ${STORAGE_TEST_ENDPOINTS_ENABLED:false}
    max-image-size: ${STORAGE_MAX_IMAGE_SIZE:5MB}
    max-document-size: ${STORAGE_MAX_DOCUMENT_SIZE:10MB}
    supabase:
      url: ${SUPABASE_URL:}
      bucket: ${SUPABASE_STORAGE_BUCKET:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      connect-timeout: ${STORAGE_CONNECT_TIMEOUT:5s}
      read-timeout: ${STORAGE_READ_TIMEOUT:15s}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ifts2-backend}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    nombre: ${BOOTSTRAP_ADMIN_NOMBRE:}
    apellido: ${BOOTSTRAP_ADMIN_APELLIDO:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    persist-authorization: false
