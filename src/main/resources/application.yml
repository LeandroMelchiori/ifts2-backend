spring:
  application:
    name: ifts2-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ifts2-backend}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    nombre: ${BOOTSTRAP_ADMIN_NOMBRE:}
    apellido: ${BOOTSTRAP_ADMIN_APELLIDO:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    persist-authorization: false
